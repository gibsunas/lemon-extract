name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Validation only: no service container, no migrations. Keeps the Prisma
      # schema from rotting while the database stays out of CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/

    strategy:
      fail-fast: false
      matrix:
        # The floor is set by @npmcli/arborist, the ceiling is the current LTS.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Audit (fails on high or critical)
        run: npm audit --audit-level=high
